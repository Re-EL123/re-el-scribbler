<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor - Re-EL Scribbler</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/toolbar.css">
  <link rel="stylesheet" href="css/canvas.css">
  <link rel="stylesheet" href="css/inspector.css">
</head>
<body>
  <div class="editor-layout">
    <header class="editor-topbar">
      <div class="topbar-left">
        <img src="assets/logos/Re-EL Scribbler Logo Badge.png" alt="Re-EL Scribbler" class="topbar-logo">
        <div class="book-title-group">
          <span id="book-title" class="book-title">Untitled Book</span>
          <button class="icon-btn" id="rename-book" title="Rename">✎</button>
        </div>
      </div>
      <div class="topbar-center">
        <div class="save-status" id="save-status">
          <span class="status-dot"></span>
          <span class="status-text">Ready</span>
        </div>
      </div>
      <div class="topbar-right">
        <button class="topbar-btn" id="undo-btn" title="Undo">Undo</button>
        <button class="topbar-btn" id="redo-btn" title="Redo">Redo</button>
        <button class="topbar-btn" id="search-btn" title="Search">Search</button>
        <button class="topbar-btn" id="preview-btn" title="Preview">Preview</button>
        <button class="topbar-btn btn-primary" id="export-btn" title="Export">Export</button>
      </div>
    </header>

    <div class="editor-main">
      <aside class="project-navigator">
        <div class="navigator-header">
          <h3>Project Navigator</h3>
        </div>
        <div class="navigator-content" id="navigator-content">
          <div class="navigator-section">
            <div class="section-title">Front Matter</div>
          </div>
          <div class="navigator-section">
            <div class="section-title">Chapters</div>
            <div class="chapter-list" id="chapter-list">
              <div class="chapter-item">
                <span class="chapter-name">Chapter 1</span>
              </div>
            </div>
            <button class="add-section-btn" id="add-chapter">+ Add Chapter</button>
          </div>
          <div class="navigator-section">
            <div class="section-title">Back Matter</div>
          </div>
          <button class="add-section-btn" id="add-section">+ Add Section</button>
        </div>
      </aside>

      <section class="canvas-area">
        <div class="formatting-toolbar">
          <div class="toolbar-group">
            <select id="font-family" class="toolbar-select">
              <option value="Inter">Inter</option>
              <option value="Georgia">Georgia</option>
              <option value="Times New Roman">Times New Roman</option>
              <option value="Arial">Arial</option>
              <option value="Helvetica">Helvetica</option>
              <option value="Garamond">Garamond</option>
              <option value="Open Sans">Open Sans</option>
              <option value="Lato">Lato</option>
            </select>
            <select id="font-size" class="toolbar-select">
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12" selected>12</option>
              <option value="14">14</option>
              <option value="16">16</option>
              <option value="18">18</option>
              <option value="24">24</option>
              <option value="32">32</option>
              <option value="48">48</option>
            </select>
          </div>
          <div class="toolbar-divider"></div>
          <div class="toolbar-group">
            <button class="toolbar-btn" id="bold-btn" title="Bold">B</button>
            <button class="toolbar-btn" id="italic-btn" title="Italic">I</button>
            <button class="toolbar-btn" id="underline-btn" title="Underline">U</button>
          </div>
          <div class="toolbar-divider"></div>
          <div class="toolbar-group">
            <select id="text-style" class="toolbar-select">
              <option value="normal">Normal</option>
              <option value="h1">Heading 1</option>
              <option value="h2">Heading 2</option>
              <option value="h3">Heading 3</option>
              <option value="h4">Heading 4</option>
              <option value="quote">Quote</option>
              <option value="caption">Caption</option>
            </select>
          </div>
          <div class="toolbar-divider"></div>
          <div class="toolbar-group">
            <button class="toolbar-btn" id="align-left" title="Align Left">◀</button>
            <button class="toolbar-btn" id="align-center" title="Align Center">▬</button>
            <button class="toolbar-btn" id="align-right" title="Align Right">▶</button>
            <button class="toolbar-btn" id="align-justify" title="Justify">▮</button>
          </div>
          <div class="toolbar-divider"></div>
          <div class="toolbar-group">
            <button class="toolbar-btn" id="bullets" title="Bullets">•</button>
            <button class="toolbar-btn" id="numbers" title="Numbers">1.</button>
          </div>
          <div class="toolbar-divider"></div>
          <div class="toolbar-group">
            <button class="toolbar-btn" id="insert-image" title="Insert Image">🖼</button>
            <button class="toolbar-btn" id="insert-drawing" title="Drawing">✏</button>
            <button class="toolbar-btn" id="insert-table" title="Table">▦</button>
          </div>
        </div>

        <div class="canvas-container">
          <div class="page-canvas" id="page-canvas">
            <div class="page-content" id="page-content" contenteditable="true">
              <h1>Chapter 1</h1>
              <p>Start writing your book here...</p>
            </div>
          </div>
        </div>

        <div class="editor-statusbar">
          <div class="statusbar-left">
            <span>Page <span id="current-page">1</span> of <span id="total-pages">1</span></span>
            <span class="statusbar-sep">|</span>
            <span><span id="word-count">0</span> words</span>
            <span class="statusbar-sep">|</span>
            <span>Target: <span id="target-words">85,000</span></span>
          </div>
          <div class="statusbar-right">
            <span>100%</span>
            <span class="statusbar-sep">|</span>
            <span id="spell-status">Spelling: On</span>
            <span class="statusbar-sep">|</span>
            <span id="sync-status">Synced</span>
          </div>
        </div>
      </section>

      <aside class="properties-inspector">
        <div class="inspector-tabs">
          <button class="inspector-tab active" data-tab="page">Page</button>
          <button class="inspector-tab" data-tab="text">Text</button>
          <button class="inspector-tab" data-tab="image">Image</button>
          <button class="inspector-tab" data-tab="drawing">Drawing</button>
        </div>
        <div class="inspector-content" id="inspector-page">
          <h4>Page Settings</h4>
          <div class="form-group">
            <label>Page Size</label>
            <select class="form-control">
              <option>US Trade (6 × 9 in)</option>
              <option>A5</option>
              <option>A4</option>
              <option>Custom</option>
            </select>
          </div>
          <div class="form-group">
            <label>Margins</label>
            <div class="margin-inputs">
              <input type="number" placeholder="Top" value="72">
              <input type="number" placeholder="Right" value="72">
              <input type="number" placeholder="Bottom" value="72">
              <input type="number" placeholder="Left" value="72">
            </div>
          </div>
          <div class="form-group">
            <label>Orientation</label>
            <div class="radio-group">
              <label><input type="radio" name="orient" checked> Portrait</label>
              <label><input type="radio" name="orient"> Landscape</label>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script type="module" src="js/editor/editor-controller.js"></script>
</body>
</html>
