<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Re-EL Scribbler</title>
  <link rel="preconnect" href="https://re-el-scribbler.vercel.app" crossorigin>
  <link rel="dns-prefetch" href="https://ptqinzavcrvnhqexkxik.supabase.co">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="modulepreload" href="js/core/ui.js">
  <link rel="modulepreload" href="vendor/lucide-subset.js">
</head>
<body>
  <div id="app-loader" role="status" aria-live="polite" aria-label="Loading">
    <img src="assets/logos/Re-EL Scribbler Logo Badge.png" alt="" class="app-loader-logo" fetchpriority="high">
    <div class="app-loader-spinner"></div>
    <p class="app-loader-text">Re-EL Scribbler</p>
  </div>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <img src="assets/logos/Re-EL Scribbler Logo Badge.png" alt="Re-EL Scribbler" class="auth-logo" fetchpriority="high">
        <h1>Create your account</h1>
        <p>Start writing your next book</p>
      </div>
      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required>
        </div>
        <div class="form-group">
          <label for="display_name">Display Name</label>
          <input type="text" id="display_name" name="display_name" autocomplete="name" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-with-icon">
          <i data-lucide="user-plus"></i><span>Sign Up</span>
        </button>
      </form>
      <div class="auth-footer">
        <p>Already have an account? <a href="login.html">Sign in</a></p>
      </div>
    </div>
  </div>
  <script type="module" src="js/auth/auth-service.js"></script>
</body>
</html>
